# SonarQube Cloud project key and organization are supplied by the scanner.
# GitHub Actions reads SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables.
sonar.projectName=SIMASU Web DevOps
sonar.projectVersion=1.0
sonar.sources=app,config,routes,resources,database/migrations
sonar.tests=tests
sonar.php.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**
sonar.coverage.exclusions=resources/**,config/**,routes/**,database/migrations/**
