name: CI DevOps

on:
  push:
    branches: [main, master, 'devops/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, openssl
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env || touch .env
          echo "APP_KEY=base64:2n6IKs9az4wR10OkNy3L+qnxpYXxKC8mD2pbAz/lYnc=" >> .env
          mkdir -p database
          touch database/database.sqlite

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run PHPUnit tests with coverage
        env:
          APP_ENV: testing
          APP_KEY: base64:2n6IKs9az4wR10OkNy3L+qnxpYXxKC8mD2pbAz/lYnc=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --coverage --min=51 --coverage-clover=coverage.xml --log-junit=test-results.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: error

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies for audit
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: composer audit || true

      - name: Install Node dependencies for audit
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high || true

  sonar-analysis:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: build-test
    # The Free plan supports the main branch and pull requests targeting it.
    # A missing Cloud project configuration skips this job explicitly.
    if: >-
      ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
          ((github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
           github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: Validate SonarQube Cloud token
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configure the SONAR_TOKEN repository secret before enabling Cloud analysis."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: phpunit-coverage
          path: .

      - name: Run SonarQube Cloud scanner and quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
